name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建并打包
        run: |
          set -eu
          name="export-files_${VERSION}_${GOOS}_${GOARCH}"
          bin="export-files"
          if [ "$GOOS" = "windows" ]; then bin="export-files.exe"; fi
          mkdir -p "stage/${name}"
          go build -trimpath -ldflags "-s -w" -o "stage/${name}/${bin}" ./cmd/export-files
          cp README.md "stage/${name}/"
          if [ -f LICENSE ]; then cp LICENSE "stage/${name}/"; fi
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -q -r "../dist/${name}.zip" "${name}")
          else
            (cd stage && tar -czf "../dist/${name}.tar.gz" "${name}")
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: export-files-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集产物并生成校验和
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: sha256sums.txt
        run: |
          cd dist
          sha256sum ./* > sha256sums.txt
          cat sha256sums.txt

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
